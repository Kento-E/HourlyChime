name: Android Distribute

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_run:
    workflows:
      - Auto Merge on Approval
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Guard workflow_run by merged PR state
        id: guard_workflow_run
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR_NUMBER" ]; then
            echo "ℹ️ workflow_run に関連するPRが見つからないため配布をスキップします。"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_MERGED=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json merged --jq '.merged')
          if [ "$IS_MERGED" = "true" ]; then
            echo "✅ PR #$PR_NUMBER はマージ済みのため配布を継続します。"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ PR #$PR_NUMBER は未マージのため配布をスキップします。"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip distribute when workflow_run PR is not merged
        if: ${{ github.event_name == 'workflow_run' && steps.guard_workflow_run.outputs.should_run != 'true' }}
        run: echo "Distribute job is skipped for this workflow_run event."

      - name: Checkout
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install required Android SDK packages
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare Firebase config and signing files
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app/keystore

          # GOOGLE_SERVICES_JSON can be stored as raw JSON or Base64.
          if echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks

      - name: Create local.properties for CI signing
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          RELEASE_STORE_FILE=keystore/release.jks
          RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
          RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Set up Gradle
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Install Firebase CLI
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        run: npm install -g firebase-tools

      - name: Build and distribute release
        if: ${{ github.event_name != 'workflow_run' || steps.guard_workflow_run.outputs.should_run == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./gradlew --no-daemon assembleRelease appDistributionUploadRelease
