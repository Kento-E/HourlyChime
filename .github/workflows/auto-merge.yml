name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.state == 'approved'

    steps:
      - name: PR情報を表示
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REVIEWER: ${{ github.actor }}
        run: |
          echo "PR #${{ github.event.pull_request.number }}: ${PR_TITLE}"
          echo "Base: ${PR_BASE}"
          echo "Head: ${PR_HEAD}"
          echo "Reviewer: ${REVIEWER}"

      - name: 自動マージを実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REVIEW_STATE: ${{ github.event.review.state || '' }}
        run: |
          echo "PR #${PR_NUMBER} の自動マージを開始します... (trigger: ${EVENT_NAME})"

          # PRがDraftかどうかをチェック
          IS_DRAFT=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} --json isDraft --jq '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "⚠️ このPRはDraft状態です。Draft状態のPRは自動マージされません。"
            echo "Ready for reviewに変更してから再度Approveしてください。"
            exit 0
          fi

          # イベント種別に関わらずPR全体の承認状態を確認
          REVIEW_DECISION=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} \
            --json reviewDecision \
            --jq '.reviewDecision')
          if [ "${REVIEW_DECISION}" != "APPROVED" ]; then
            if [ "${EVENT_NAME}" = "pull_request_review" ] && [ "${EVENT_REVIEW_STATE}" = "approved" ]; then
              echo "ℹ️ reviewDecision が未反映の可能性があるため、最新レビュー状態を確認します。"
              REVIEW_SUMMARY=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} \
                --json reviews \
                --jq '
                  .reviews
                  | group_by(.author.login)
                  | map(max_by(.submittedAt))
                  | {
                      hasApproved: any(.state == "APPROVED"),
                      hasChangesRequested: any(.state == "CHANGES_REQUESTED")
                    }')
              HAS_APPROVED=$(echo "${REVIEW_SUMMARY}" | jq -r '.hasApproved')
              HAS_CHANGES_REQUESTED=$(echo "${REVIEW_SUMMARY}" | jq -r '.hasChangesRequested')
              if [ "${HAS_APPROVED}" != "true" ] || [ "${HAS_CHANGES_REQUESTED}" = "true" ]; then
                echo "ℹ️ PR #${PR_NUMBER} は承認要件を満たしていません。スキップします。"
                exit 0
              fi
            else
              echo "ℹ️ PR #${PR_NUMBER} はまだApproveされていません。スキップします。"
              exit 0
            fi
          fi

          # PRのマージ可能状態を確認
          echo "📋 PR状態を確認中..."
          gh pr view ${PR_NUMBER} --repo ${{ github.repository }} --json mergeable,mergeStateStatus --jq '.mergeable,.mergeStateStatus'

          # 自動マージを有効化（スカッシュマージ、ブランチ削除）
          echo "🔄 自動マージを設定中..."
          gh pr merge ${PR_NUMBER} --repo ${{ github.repository }} --squash --auto --delete-branch

          echo "✅ PR #${PR_NUMBER} の自動マージが有効化されました"
          echo ""
          echo "📝 今後の動作:"
          echo "  - ブランチ保護ルールや必須ステータスチェックが設定されている場合、それらの条件が満たされると自動的に Squash and Merge が実行されます。"
          echo "  - そうした要件がない場合は、承認後すぐにマージされている可能性があります。"
          echo "  - マージが完了すると、指定どおりブランチは自動的に削除されます。"
