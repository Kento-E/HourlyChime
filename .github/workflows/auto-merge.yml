name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '自動マージするPR番号'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      github.event.review.state == 'approved'

    steps:
      - name: PR番号を解決
        id: resolve-pr
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "${PR_NUMBER_INPUT}" ]; then
            echo "pr_number=${PR_NUMBER_INPUT}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${PR_NUMBER_EVENT}" >> $GITHUB_OUTPUT
          fi

      - name: PR情報を表示
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
        run: |
          gh pr view ${PR_NUMBER} --repo ${{ github.repository }} \
            --json number,title,baseRefName,headRefName,author \
            --jq '"PR #\(.number): \(.title)\nBase: \(.baseRefName)\nHead: \(.headRefName)\nAuthor: \(.author.login)"'

      - name: 自動マージを実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "PR #${PR_NUMBER} の自動マージを開始します... (trigger: ${EVENT_NAME})"

          # PRがDraftかどうかをチェック
          IS_DRAFT=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} --json isDraft --jq '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "⚠️ このPRはDraft状態です。Draft状態のPRは自動マージされません。"
            echo "Ready for reviewに変更してから再度Approveしてください。"
            exit 0
          fi

          # pull_request_target (synchronize) の場合はApprove済みかを確認
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            APPROVED=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} \
              --json reviews \
              --jq '[.reviews[] | select(.state=="APPROVED")] | length')
            if [ "${APPROVED}" = "0" ]; then
              echo "ℹ️ PR #${PR_NUMBER} はまだApproveされていません。スキップします。"
              exit 0
            fi
          fi

          # PRのマージ可能状態を確認
          echo "📋 PR状態を確認中..."
          gh pr view ${PR_NUMBER} --repo ${{ github.repository }} --json mergeable,mergeStateStatus --jq '.mergeable,.mergeStateStatus'

          # 自動マージを有効化（スカッシュマージ、ブランチ削除）
          echo "🔄 自動マージを設定中..."
          gh pr merge ${PR_NUMBER} --repo ${{ github.repository }} --squash --auto --delete-branch

          echo "✅ PR #${PR_NUMBER} の自動マージが有効化されました"
          echo ""
          echo "📝 今後の動作:"
          echo "  - ブランチ保護ルールや必須ステータスチェックが設定されている場合、それらの条件が満たされると自動的に Squash and Merge が実行されます。"
          echo "  - そうした要件がない場合は、承認後すぐにマージされている可能性があります。"
          echo "  - マージが完了すると、指定どおりブランチは自動的に削除されます。"
