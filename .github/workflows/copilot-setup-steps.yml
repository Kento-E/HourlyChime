name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create stub rtk command
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/rtk" <<'SCRIPT'
          #!/usr/bin/env bash
          # rtk stub: passes commands through; handles gain/proxy subcommands
          if [ "$#" -eq 0 ]; then
            echo "usage: rtk {gain [--history]|proxy <command> [args...]|<command> [args...]}" >&2
            exit 2
          fi
          case "$1" in
            gain) echo "(rtk gain: stub)" ;;
            proxy)
              shift
              if [ "$#" -eq 0 ]; then
                echo "usage: rtk proxy <command> [<args>...]" >&2
                exit 1
              fi
              exec "$@"
              ;;
            *)
              if [ "$1" = "gradlew" ] && [ -x "./gradlew" ]; then
                shift
                exec ./gradlew "$@"
              fi
              exec "$@"
              ;;
          esac
          SCRIPT
          chmod +x "$HOME/.local/bin/rtk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create dummy google-services.json for development
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1052281628451",
              "project_id": "hourlychime",
              "storage_bucket": "hourlychime.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1052281628451:android:3d20d418e11e45e48f0e96",
                  "android_client_info": {
                    "package_name": "com.example.hourlychime"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "PLACEHOLDER"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Warm up Gradle dependency resolution
        run: ./gradlew --no-daemon help
